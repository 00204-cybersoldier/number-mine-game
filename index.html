<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>1～100 踩地雷</title>
<style>
:root {
  color-scheme: dark;
  --bg: #101827;
  --panel: #1b293b;
  --panel2: #24354b;
  --text: #f4f7fb;
  --muted: #aab8c9;
  --line: #40536a;
  --safe: #145b3c;
  --safeText: #a7f3c5;
  --danger: #ff563f;
  --gold: #ffd166;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; padding: 20px 12px 36px;
  background: radial-gradient(ellipse at top, #243b57 0, var(--bg) 62%);
  color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}
main { width: min(920px, 100%); margin: 0 auto; }
h1 { text-align: center; margin: 4px 0 16px; font-size: clamp(1.8rem, 5vw, 2.6rem); letter-spacing: .04em; }
.panel {
  background: linear-gradient(145deg, rgba(36,53,75,.98), rgba(24,37,55,.98));
  border: 1px solid #52667e; border-radius: 16px; padding: 14px; margin-bottom: 14px;
  box-shadow: 0 12px 30px rgba(0,0,0,.2);
}
.controls { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
label { color: var(--muted); font-weight: 650; }
select, button {
  font: inherit; border-radius: 10px; border: 1px solid #647b95; padding: 10px 14px;
}
select { color:var(--text); background:#142235; min-width:112px; }
button { cursor:pointer; font-weight:750; color:white; background:#2463a6; border-color:#4e91d5; }
button:hover:not(:disabled) { filter:brightness(1.13); }
button:disabled { cursor:not-allowed; opacity:.45; }
.primary { background:linear-gradient(135deg,#2678c9,#174d91); min-width:180px; }
.status {
  display:grid; grid-template-columns:1fr 1fr; gap:10px; text-align:center;
}
.status .cell { background:rgba(8,18,31,.35); border-radius:12px; padding:12px 8px; }
.kicker { display:block; color:var(--muted); font-size:.85rem; margin-bottom:4px; }
.big { font-size:clamp(1.35rem,4vw,2rem); font-weight:850; font-variant-numeric:tabular-nums; }
.turn { color:#91f0b8; }
#message { min-height:1.5em; margin:12px 0 2px; text-align:center; color:#d6e2ef; font-weight:650; }
.section-title { font-weight:800; margin: 2px 0 10px; }
.grid {
  display:grid; grid-template-columns:repeat(10,minmax(0,1fr)); gap:3px;
  width:100%;
}
.number {
  min-width:0; aspect-ratio:1 / 1; padding:0; display:flex; align-items:center; justify-content:center;
  border-radius:5px; border:1px solid #64758a; background:#eaf1f8; color:#152337;
  font-size:clamp(13px, 3.35vw, 29px); line-height:1; font-weight:900;
  font-variant-numeric:tabular-nums; letter-spacing:-.055em;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.12);
}
.number:not(:disabled):hover { background:#fff; transform:translateY(-1px); }
.number:focus-visible, button:focus-visible, select:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
.number:disabled { opacity:1; cursor:default; }
.number.eliminated { background:#b9c0c9; color:#7b8490; border-color:#aab2bd; }
.number.safe { background:#bcebd0; color:#075a34; border-color:#53b77e; }
.number.mine { background:#dc2626; color:white; border:2px solid #ffe08a; animation:minePulse .7s infinite alternate; }
.legend { display:flex; gap:16px; flex-wrap:wrap; color:var(--muted); font-size:.86rem; margin-top:12px; }
.dot { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-1px; margin-right:5px; background:#eaf1f8; }
.dot.gray { background:#b9c0c9; } .dot.green { background:#bcebd0; }
.history { display:flex; flex-direction:column; gap:6px; }
.history-row { display:flex; justify-content:space-between; gap:12px; padding:8px 10px; background:rgba(8,18,31,.3); border-radius:8px; }
.tag { font-size:.8rem; font-weight:800; color:#a7f3c5; }
.tag.bad { color:#ff9d91; }
.note { color:var(--muted); font-size:.88rem; line-height:1.55; }
.hidden { display:none !important; }

/* 爆炸覆蓋層 */
#blast {
  position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
  background:rgba(15,5,8,.9); overflow:hidden; opacity:0; pointer-events:none;
}
#blast.show { animation:blastIn 1.9s ease-out both; pointer-events:auto; }
.blast-content { position:relative; z-index:2; text-align:center; padding:24px; }
.boom-word {
  color:#fff3b0; font-size:clamp(3.8rem,15vw,9rem); font-weight:1000; line-height:1;
  text-shadow:0 0 10px #fff, 0 0 28px #ffb000, 0 0 65px #ff3d00, 7px 8px 0 #9d160b;
  animation:boomPop .55s cubic-bezier(.12,.8,.2,1.25) both;
}
.blast-sub { color:white; font-size:clamp(1.15rem,4vw,2rem); font-weight:850; margin-top:18px; text-shadow:0 2px 12px #000; }
.blast-number { color:#ffd166; font-size:1.2rem; margin-top:8px; font-weight:800; }
.burst {
  position:absolute; width:min(78vw,560px); aspect-ratio:1; border-radius:50%;
  background:radial-gradient(circle, #fffbd1 0 4%, #ffe45c 7%, #ff8a00 20%, #ef321b 37%, rgba(150,15,20,.3) 58%, transparent 70%);
  filter:drop-shadow(0 0 45px #ff5a00); animation:burst .95s ease-out both;
}
.rays {
  position:absolute; width:min(110vw,850px); aspect-ratio:1;
  background:repeating-conic-gradient(from 0deg, rgba(255,211,74,.95) 0deg 5deg, transparent 5deg 15deg);
  clip-path:polygon(50% 0,56% 37%,75% 5%,65% 42%,100% 30%,69% 53%,96% 75%,61% 64%,70% 100%,50% 69%,28% 100%,39% 64%,0 77%,32% 52%,2% 28%,39% 40%,28% 2%,47% 37%);
  animation:raySpin 1.1s ease-out both; opacity:.85;
}
.spark {
  position:absolute; left:50%; top:50%; width:9px; height:35px; border-radius:8px;
  background:linear-gradient(#fff8bd,#ff5a00); transform-origin:50% 220px;
  animation:sparkFly .85s ease-out both;
}
body.shake { animation:screenShake .45s linear; }
#flash { position:fixed; inset:0; z-index:19; background:white; opacity:0; pointer-events:none; }
#flash.go { animation:flash .45s ease-out; }
@keyframes blastIn { 0%{opacity:0} 8%{opacity:1} 78%{opacity:1} 100%{opacity:0} }
@keyframes boomPop { 0%{transform:scale(.08) rotate(-12deg);opacity:0} 65%{transform:scale(1.18) rotate(3deg);opacity:1} 100%{transform:scale(1) rotate(0)} }
@keyframes burst { 0%{transform:scale(.05);opacity:1} 75%{transform:scale(1.15);opacity:.95} 100%{transform:scale(1.35);opacity:0} }
@keyframes raySpin { 0%{transform:scale(.1) rotate(0);opacity:1} 100%{transform:scale(1.15) rotate(28deg);opacity:0} }
@keyframes sparkFly { 0%{transform:rotate(var(--a)) translateY(0) scaleY(.2);opacity:1} 100%{transform:rotate(var(--a)) translateY(-min(40vh,260px)) scaleY(1);opacity:0} }
@keyframes flash { 0%{opacity:.95} 100%{opacity:0} }
@keyframes screenShake { 0%,100%{transform:translate(0)} 20%{transform:translate(-7px,4px)} 40%{transform:translate(7px,-4px)} 60%{transform:translate(-5px,-3px)} 80%{transform:translate(5px,3px)} }
@keyframes minePulse { from{box-shadow:0 0 0 0 rgba(255,60,30,.2)} to{box-shadow:0 0 14px 5px rgba(255,60,30,.75)} }
@media (max-width:480px) {
  body { padding:12px 6px 24px; }
  .panel { padding:10px; }
  .grid { gap:2px; }
  .number { border-radius:3px; font-size:clamp(12px,3.55vw,18px); }
}
@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
}
</style>
</head>
<body>
<main id="game">
  <h1>💣 1～100 踩地雷</h1>
  <section class="panel controls">
    <label for="players">玩家人數
      <select id="players">
        <option value="2">2 人</option><option value="3">3 人</option>
        <option value="4">4 人</option><option value="5">5 人</option><option value="6">6 人</option>
      </select>
    </label>
    <button class="primary" id="start">開始新遊戲</button>
  </section>

  <section class="panel">
    <div class="status">
      <div class="cell"><span class="kicker">目前輪到</span><span class="big turn" id="turn">尚未開始</span></div>
      <div class="cell"><span class="kicker">地雷可能範圍</span><span class="big" id="range">1～100</span></div>
    </div>
    <div id="message" aria-live="polite">選擇玩家人數，按下「開始新遊戲」即可開始。</div>
  </section>

  <section class="panel">
    <div class="section-title">選擇號碼</div>
    <div class="grid" id="grid" aria-label="1 到 100 號碼選擇區"></div>
    <div class="legend">
      <span><i class="dot"></i>可選擇</span>
      <span><i class="dot gray"></i>已排除</span>
      <span><i class="dot green"></i>安全選過</span>
    </div>
  </section>

  <section class="panel">
    <div class="section-title">選號紀錄</div>
    <div class="history" id="history"><div class="note">尚無選號紀錄。</div></div>
  </section>
  <p class="note">遊戲規則：安全選號後，系統會依地雷所在方向縮小可能範圍；被排除的號碼會以淺灰色顯示。踩中地雷的玩家輸掉本局。</p>
</main>

<div id="flash"></div>
<div id="blast" aria-hidden="true">
  <div class="rays"></div><div class="burst"></div>
  <div id="sparks"></div>
  <div class="blast-content">
    <div class="boom-word">BOOM!</div>
    <div class="blast-sub" id="blast-sub">踩中地雷！</div>
    <div class="blast-number" id="blast-number"></div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const grid = $('grid');
  let mine = null, turn = 0, low = 1, high = 100;
  let started = false, over = false, chosen = new Set(), history = [];

  // 建立固定的 1～100 號碼格
  const buttons = [];
  for (let n = 1; n <= 100; n++) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'number'; b.textContent = n;
    b.setAttribute('aria-label', `選擇 ${n} 號`);
    b.disabled = true;
    b.addEventListener('click', () => pick(n));
    grid.appendChild(b); buttons.push(b);
  }

  function render() {
    $('turn').textContent = !started ? '尚未開始' : over ? `玩家 ${turn + 1}（出局）` : `玩家 ${turn + 1}`;
    $('range').textContent = `${low}～${high}`;
    buttons.forEach((b, i) => {
      const n = i + 1;
      b.className = 'number';
      if (n < low || n > high) b.classList.add('eliminated');
      if (chosen.has(n) && n !== mine) b.classList.add('safe');
      if (over && n === mine) b.classList.add('mine');
      b.disabled = !started || over || n < low || n > high || chosen.has(n);
      b.setAttribute('aria-label', `${n} 號${n < low || n > high ? '，已排除' : chosen.has(n) ? '，已選過' : '，可選擇'}`);
    });
    $('history').innerHTML = '';
    if (!history.length) {
      const empty = document.createElement('div'); empty.className = 'note'; empty.textContent = '尚無選號紀錄。'; $('history').appendChild(empty);
    } else {
      history.forEach(item => {
        const row = document.createElement('div'); row.className = 'history-row';
        const left = document.createElement('span'); left.textContent = `玩家 ${item.player}：選擇 ${item.number} 號`;
        const right = document.createElement('span'); right.className = `tag${item.safe ? '' : ' bad'}`; right.textContent = item.safe ? '安全' : '踩中地雷';
        row.append(left, right); $('history').appendChild(row);
      });
    }
  }

  function startGame() {
    mine = Math.floor(Math.random() * 100) + 1;
    turn = 0; low = 1; high = 100; chosen = new Set(); history = [];
    started = true; over = false;
    $('players').disabled = false;
    $('message').textContent = '遊戲開始！請玩家 1 選擇一個號碼。';
    $('start').textContent = '重新開始遊戲';
    $('blast').classList.remove('show');
    render();
  }

  function playExplosion(player, number) {
    $('blast-sub').textContent = `玩家 ${player} 踩中地雷！`;
    $('blast-number').textContent = `地雷號碼：${number}`;
    const sparks = $('sparks'); sparks.innerHTML = '';
    for (let i = 0; i < 18; i++) {
      const s = document.createElement('i'); s.className = 'spark';
      s.style.setProperty('--a', `${i * 20}deg`);
      sparks.appendChild(s);
    }
    const flash = $('flash');
    flash.classList.remove('go'); $('blast').classList.remove('show');
    void flash.offsetWidth;
    flash.classList.add('go');
    document.body.classList.remove('shake'); void document.body.offsetWidth;
    document.body.classList.add('shake');
    $('blast').classList.add('show');
    // 若瀏覽器允許，使用 Web Audio 產生短促低頻爆炸聲；不需外部音檔。
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        const ctx = new AudioContext(), osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(105, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(28, ctx.currentTime + .42);
        gain.gain.setValueAtTime(.22, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .45);
        osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + .46);
        osc.onended = () => ctx.close();
      }
    } catch (_) {}
    setTimeout(() => document.body.classList.remove('shake'), 500);
    setTimeout(() => $('blast').classList.remove('show'), 2100);
  }

  function pick(number) {
    if (!started || over || number < low || number > high || chosen.has(number)) return;
    chosen.add(number);
    if (number === mine) {
      over = true;
      history.unshift({player: turn + 1, number, safe: false});
      $('message').textContent = `BOOM！玩家 ${turn + 1} 踩中地雷，本局結束。`;
      render();
      playExplosion(turn + 1, number);
      return;
    }
    history.unshift({player: turn + 1, number, safe: true});
    if (number < mine) low = number + 1;
    else high = number - 1;
    const total = Number($('players').value);
    turn = (turn + 1) % total;
    $('message').textContent = `安全！號碼 ${number} 已排除，現在輪到玩家 ${turn + 1}。`;
    render();
  }

  $('start').addEventListener('click', startGame);
  $('players').addEventListener('change', () => {});
  render();
})();
</script>
</body>
</html>
